<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Vue Migration Skill</title>
  <desc id="description">从 Vue 2 到现代 Vue 3：依赖自适应、代码改写、缺陷修复与多智能体协作。</desc>
  <defs>
    <linearGradient id="bg" x2="1200" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#101E2D"/><stop offset="1" stop-color="#071711"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#A6E8CD" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M858 0 662 320M1050 0 854 320M1200 70 1044 320" stroke="#42D392" stroke-opacity=".09" stroke-width="2"/>
  <rect x="56" y="43" width="5" height="26" rx="2.5" fill="#42D392"/>
  <g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">
    <text x="76" y="63" fill="#99CDB8" font-size="15" font-weight="600" letter-spacing="3">面向 AI 编程智能体的迁移工作流</text>
    <text x="56" y="134" fill="#F1FFF8" font-size="53" font-weight="750" letter-spacing="-1.5">Vue Migration Skill</text>
    <text x="58" y="178" fill="#B5CDBF" font-size="21">让旧项目走向现代 Vue，让每一步迁移都有据可查。</text>
    <rect x="58" y="218" width="132" height="36" rx="18" stroke="#34584B" fill="#132B23"/>
    <rect x="202" y="218" width="132" height="36" rx="18" stroke="#34584B" fill="#132B23"/>
    <rect x="346" y="218" width="132" height="36" rx="18" stroke="#34584B" fill="#132B23"/>
    <rect x="490" y="218" width="148" height="36" rx="18" stroke="#34584B" fill="#132B23"/>
    <g fill="#B9E8D0" font-size="15" text-anchor="middle"><text x="124" y="242">依赖自适应</text><text x="268" y="242">现代化改写</text><text x="412" y="242">同步修复 BUG</text><text x="564" y="242">多智能体协作</text></g>
    <text x="56" y="293" fill="#6F9686" font-size="13" letter-spacing="1">CODEX / CLAUDE CODE / 支持文件与终端工具的 AI 编程环境</text>
    <rect x="844" y="85" width="112" height="132" rx="18" stroke="#48625E" fill="#14282A"/>
    <rect x="1030" y="85" width="112" height="132" rx="18" stroke="#42D392" stroke-opacity=".7" fill="#123527"/>
    <text x="900" y="117" fill="#88A5A0" font-size="15" text-anchor="middle">VUE</text>
    <text x="900" y="186" fill="#A8BCB7" font-size="67" font-weight="700" text-anchor="middle">2</text>
    <text x="1086" y="117" fill="#8AE7B5" font-size="15" text-anchor="middle">VUE</text>
    <text x="1086" y="186" fill="#59E8A2" font-size="67" font-weight="700" text-anchor="middle">3</text>
  </g>
  <path d="M974 151h38m-11-11 11 11-11 11" stroke="#71DAB4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
