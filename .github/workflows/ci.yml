name: 辅助脚本与仓库检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: 记录实际运行环境
        run: |
          node --version
          npm --version
      - name: 检查脚本、文档引用与边界行为
        run: node --test
