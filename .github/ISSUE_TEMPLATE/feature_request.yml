name: 功能与适配建议
description: 提出有具体使用场景的改进或平台适配需求
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明真实使用场景，勿包含内部项目资料或凭证。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与适用范围
      description: 是否对所有项目适用？若只适用特定依赖或宿主，请说明触发条件。
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: 平台及能力依据
      description: 宿主/客户端版本、模型、官方文档和已有验证；仅模型名称不足以判定工具能力。
  - type: textarea
    id: verification
    attributes:
      label: 如何验收
      description: 提供可观察结果、可脱敏测试场景或兼容性验证方法。
